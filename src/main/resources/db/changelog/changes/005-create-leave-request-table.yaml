databaseChangeLog:
  - changeSet:
      id: 005-create-leave-request-table
      author: safiy
      changes:
        - createTable:
            tableName: leave_request
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(500)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: VARCHAR(500)
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_leaverequest_employee
                    references: employee(id)
              - column:
                  name: leave_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_leaverequest_leavetype
                    references: leave_type(id)